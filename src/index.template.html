<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>空の箱 — GIRLS BAND CRY × DSH</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
body { font-family: "Space Mono", Consolas, monospace; }
#gbc-mount { position: fixed; inset: 0; }
</style>
<style>/*__FONTS__*/</style>
<style>/*__CSS__*/</style>
</head>
<body>
<div id="gbc-mount"><!--__MARKUP__--></div>
<script>
(function () {
  function report(message, stack) {
    console.error('[gbc-wallpaper]', message, stack || '');
    if (!/[?&]debug=1/.test(location.search)) return;
    var pre = document.getElementById('gbc-error');
    if (!pre) {
      pre = document.createElement('pre');
      pre.id = 'gbc-error';
      pre.style.cssText = 'position:fixed;z-index:9999;left:12px;top:120px;max-width:90vw;max-height:70vh;overflow:auto;padding:12px;background:#300;color:#fff;font:12px/1.5 monospace;white-space:pre-wrap';
      document.body.appendChild(pre);
    }
    pre.textContent += message + '\n' + (stack || '') + '\n';
    document.documentElement.setAttribute('data-gbc-error', message);
  }
  window.addEventListener('error', function (e) { report(e.message, e.error && e.error.stack); });
  window.addEventListener('unhandledrejection', function (e) { report('unhandled rejection: ' + e.reason, e.reason && e.reason.stack); });
  window.__gbcReport = report;
})();
</script>
<script>/*__JS__*/</script>
<script>
(function () {
  function boot() {
    if (!window.GBCWallpaper) return;
    var params = new URLSearchParams(location.search);
    window.gbcWallpaper = window.GBCWallpaper.mount(document.getElementById('gbc-mount'), {
      standalone: true,
      mode: params.get('mode') || undefined,
      time: params.has('t') ? Number(params.get('t')) : undefined,
      hud: params.get('hud') !== '0'
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
